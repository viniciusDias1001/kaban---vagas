<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kanban de Vagas</title>
  <!-- Mark: a briefcase (the job) whose face is a three-column kanban board.
       Built on a 256 grid; shapes stay >= 20 units so the silhouette survives at 16 px. -->
  <defs>
    <linearGradient id="tile-fill" x1="48" y1="0" x2="208" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9ab2ff"/>
      <stop offset=".55" stop-color="#7c9cff"/>
      <stop offset="1" stop-color="#5068dc"/>
    </linearGradient>
    <linearGradient id="tile-rim" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="case-fill" x1="0" y1="72" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eeff"/>
    </linearGradient>
    <linearGradient id="column-fill" x1="0" y1="96" x2="0" y2="196" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5873e6"/>
      <stop offset="1" stop-color="#3f56c4"/>
    </linearGradient>
    <filter id="case-lift" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#23338f" flood-opacity=".35"/>
    </filter>
  </defs>

  <g id="tile">
    <rect width="256" height="256" rx="56" fill="url(#tile-fill)"/>
    <rect x="1.5" y="1.5" width="253" height="253" rx="54.5" fill="none" stroke="url(#tile-rim)" stroke-width="3"/>
  </g>

  <g id="briefcase" transform="translate(0 -2)" filter="url(#case-lift)">
    <path id="handle" d="M102 80V64a14 14 0 0 1 14-14h24a14 14 0 0 1 14 14v16"
          fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round"/>
    <rect id="case" x="36" y="72" width="184" height="148" rx="30" fill="url(#case-fill)"/>
    <g id="board" fill="url(#column-fill)">
      <rect x="60" y="96" width="36" height="100" rx="10"/>
      <rect x="110" y="96" width="36" height="46" rx="10"/>
      <rect x="160" y="96" width="36" height="74" rx="10"/>
    </g>
  </g>
</svg>
